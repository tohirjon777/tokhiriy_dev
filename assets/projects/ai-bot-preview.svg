<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06142E"/>
      <stop offset="100%" stop-color="#092556"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGrad3)"/>
  
  <!-- Ambient neural dots -->
  <g opacity="0.15" fill="#38BDF8">
    <circle cx="120" cy="80" r="4"/>
    <circle cx="240" cy="140" r="3"/>
    <circle cx="160" cy="300" r="5"/>
    <circle cx="680" cy="120" r="4"/>
    <circle cx="640" cy="380" r="3"/>
  </g>

  <!-- Telegram Mini App & AI Chat Mockup -->
  <g transform="translate(180, 40)">
    <!-- Phone Screen -->
    <rect x="0" y="0" width="440" height="420" rx="20" fill="#0A1E40" stroke="#0066FF" stroke-width="2"/>
    <rect x="0" y="0" width="440" height="50" rx="20" fill="#0E2B5C"/>
    <text x="24" y="32" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="sans-serif">SmartDesk AI • Telegram Mini App</text>
    <circle cx="410" cy="25" r="8" fill="#10B981"/>

    <!-- Chat Messages -->
    <g transform="translate(24, 70)">
      <!-- User message -->
      <rect x="180" y="0" width="210" height="42" rx="10" fill="#0066FF"/>
      <text x="194" y="24" fill="#FFFFFF" font-size="12" font-family="sans-serif">Assalomu alaykum, narxlar bormi?</text>
      <text x="350" y="35" fill="rgba(255,255,255,0.7)" font-size="9" font-family="sans-serif">14:20</text>

      <!-- AI Bot response -->
      <g transform="translate(0, 56)">
        <circle cx="16" cy="16" r="16" fill="url(#aiGrad)"/>
        <text x="10" y="21" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="sans-serif">AI</text>
        <rect x="42" y="0" width="310" height="74" rx="10" fill="#0C2554" stroke="rgba(0, 229, 255, 0.3)"/>
        <text x="56" y="22" fill="#00E5FF" font-size="11" font-weight="bold" font-family="sans-serif">SmartDesk AI Agent (OpenAI GPT):</text>
        <text x="56" y="42" fill="#F5F9FF" font-size="12" font-family="sans-serif">Va alaykum assalom! Barcha paketlarimiz</text>
        <text x="56" y="60" fill="#F5F9FF" font-size="12" font-family="sans-serif">quyidagi interaktiv katalogda keltirilgan:</text>
      </g>

      <!-- Mini App Product Cards Carousel -->
      <g transform="translate(42, 144)">
        <rect x="0" y="0" width="160" height="96" rx="8" fill="#0F316C" stroke="rgba(22, 139, 255, 0.3)"/>
        <text x="12" y="24" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="sans-serif">Business Bot Paketi</text>
        <text x="12" y="44" fill="#38BDF8" font-size="14" font-weight="bold" font-family="sans-serif">$450</text>
        <rect x="12" y="56" width="136" height="28" rx="6" fill="#0066FF"/>
        <text x="40" y="74" fill="#FFFFFF" font-size="11" font-weight="bold" font-family="sans-serif">Buyurtma berish</text>

        <rect x="174" y="0" width="160" height="96" rx="8" fill="#0F316C" stroke="rgba(22, 139, 255, 0.3)"/>
        <text x="186" y="24" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="sans-serif">CRM + AI Integratsiya</text>
        <text x="186" y="44" fill="#38BDF8" font-size="14" font-weight="bold" font-family="sans-serif">$950</text>
        <rect x="186" y="56" width="136" height="28" rx="6" fill="#0066FF"/>
        <text x="214" y="74" fill="#FFFFFF" font-size="11" font-weight="bold" font-family="sans-serif">Buyurtma berish</text>
      </g>

      <!-- Input box -->
      <g transform="translate(0, 260)">
        <rect x="0" y="0" width="390" height="38" rx="19" fill="#081836" stroke="rgba(255,255,255,0.1)"/>
        <text x="18" y="24" fill="#64748B" font-size="12" font-family="sans-serif">Xabar yozing yoki ovozli xabar qoldiring...</text>
        <circle cx="366" cy="19" r="14" fill="#0066FF"/>
        <path d="M362 19 L368 15 L368 23 Z" fill="#FFFFFF"/>
      </g>
    </g>
  </g>
</svg>
