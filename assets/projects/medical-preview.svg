<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041226"/>
      <stop offset="100%" stop-color="#09244A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#medBg)"/>

  <!-- Healthcare Calendar & Booking UI -->
  <g transform="translate(100, 50)">
    <rect x="0" y="0" width="600" height="400" rx="14" fill="#081A38" stroke="rgba(22, 139, 255, 0.3)" stroke-width="2"/>
    <rect x="0" y="0" width="600" height="44" rx="14" fill="#0D2550"/>
    <text x="24" y="28" fill="#FFFFFF" font-size="14" font-weight="bold" font-family="sans-serif">MedLine Clinic • Bemorlar &amp; Shifokorlar Ish Jadvali</text>
    
    <!-- Doctor Card Left -->
    <g transform="translate(24, 60)">
      <rect x="0" y="0" width="190" height="315" rx="10" fill="#0A1F42"/>
      <circle cx="95" cy="55" r="32" fill="#143A70"/>
      <path d="M95 40 L95 70 M80 55 L110 55" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>
      <text x="95" y="110" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="sans-serif">Dr. Sobirov A.</text>
      <text x="95" y="128" text-anchor="middle" fill="#94A3B8" font-size="10" font-family="sans-serif">Bosh Kardiolog • 14 yil</text>
      <line x1="20" y1="144" x2="170" y2="144" stroke="rgba(255,255,255,0.08)"/>

      <text x="20" y="170" fill="#00E5FF" font-size="11" font-weight="bold" font-family="sans-serif">Bugungi Qabul:</text>
      <text x="20" y="195" fill="#FFFFFF" font-size="11" font-family="sans-serif">09:00 — Band</text>
      <text x="20" y="220" fill="#FFFFFF" font-size="11" font-family="sans-serif">10:30 — Band</text>
      <text x="20" y="245" fill="#10B981" font-size="11" font-weight="bold" font-family="sans-serif">11:45 — Bo‘sh (Ochiq)</text>
      <text x="20" y="270" fill="#FFFFFF" font-size="11" font-family="sans-serif">14:00 — Band</text>

      <rect x="20" y="282" width="150" height="24" rx="6" fill="#0066FF"/>
      <text x="95" y="298" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="bold" font-family="sans-serif">Navbatga yozish</text>
    </g>

    <!-- Schedule Matrix Right -->
    <g transform="translate(230, 60)">
      <rect x="0" y="0" width="345" height="315" rx="10" fill="#0A1F42"/>
      <text x="20" y="30" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="sans-serif">Avtomatlashtirilgan Xabarnomalar</text>

      <!-- SMS Reminder Card -->
      <rect x="20" y="50" width="305" height="65" rx="8" fill="#0E2B5C" stroke="rgba(0, 229, 255, 0.2)"/>
      <circle cx="44" cy="82" r="14" fill="#00E5FF" opacity="0.2"/>
      <text x="70" y="74" fill="#00E5FF" font-size="11" font-weight="bold" font-family="sans-serif">SMS Eslatma (Yuborildi ✓)</text>
      <text x="70" y="94" fill="#94A3B8" font-size="10" font-family="sans-serif">«Hurmatli bemor, bugun 11:45 da qabulingiz bor»</text>

      <!-- Telegram Bot Notification -->
      <rect x="20" y="130" width="305" height="65" rx="8" fill="#0E2B5C" stroke="rgba(22, 139, 255, 0.2)"/>
      <circle cx="44" cy="162" r="14" fill="#0088CC" opacity="0.3"/>
      <text x="70" y="154" fill="#38BDF8" font-size="11" font-weight="bold" font-family="sans-serif">Telegram Bot Xabari (Qabul qilindi)</text>
      <text x="70" y="174" fill="#94A3B8" font-size="10" font-family="sans-serif">Tahlil natijalari kartaga yuklandi va tasdiqlandi</text>

      <!-- Queue Status Box -->
      <g transform="translate(20, 215)">
        <rect x="0" y="0" width="305" height="85" rx="8" fill="#091A38" stroke="rgba(16, 185, 129, 0.3)"/>
        <text x="16" y="26" fill="#10B981" font-size="12" font-weight="bold" font-family="sans-serif">Elektron Navbat Boshqaruvi</text>
        <text x="16" y="46" fill="#FFFFFF" font-size="11" font-family="sans-serif">Kutish zali monitoriga jonli uzatish faol</text>
        <rect x="16" y="56" width="110" height="18" rx="4" fill="#059669"/>
        <text x="24" y="69" fill="#FFFFFF" font-size="9" font-weight="bold" font-family="sans-serif">Kutish vaqti: 4 daqiqa</text>
      </g>
    </g>
  </g>
</svg>
