      <g transform="translate(190, 210)">
        <rect x="0" y="0" width="350" height="60" rx="10" fill="#061836" stroke="#00E5FF" stroke-width="1.5"/>
        <circle cx="28" cy="30" r="14" fill="#0088CC"/>
        <path d="M22 30 L27 33 L35 24" stroke="#FFFFFF" stroke-width="2" fill="none"/>
        <text x="52" y="26" fill="#00E5FF" font-size="11" font-weight="bold" font-family="sans-serif">Telegram Bot Sinxronizatsiyasi</text>
        <text x="52" y="44" fill="#94A3B8" font-size="10" font-family="sans-serif">Ombor qoldiqlari va buyurtmalar 1 soniyada yangilanadi</text>
      </g>
