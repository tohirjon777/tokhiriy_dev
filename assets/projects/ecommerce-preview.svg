      <text x="14" y="142" fill="#00E5FF" font-size="13" font-weight="bold" font-family="sans-serif">650 000 so‘m</text>
      <rect x="14" y="154" width="132" height="26" rx="6" fill="#0066FF"/>
      <text x="44" y="171" fill="#FFFFFF" font-size="10" font-weight="bold" font-family="sans-serif">Savatga qo‘shish</text>

      <!-- Card 2 -->
      <rect x="190" y="0" width="160" height="190" rx="10" fill="#0D2652"/>
      <rect x="200" y="10" width="140" height="90" rx="6" fill="#143670"/>
      <circle cx="270" cy="55" r="22" fill="#F59E0B" opacity="0.4"/>
      <text x="204" y="122" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="sans-serif">Wireless Buds 3</text>
      <text x="204" y="142" fill="#00E5FF" font-size="13" font-weight="bold" font-family="sans-serif">420 000 so‘m</text>
      <rect x="204" y="154" width="132" height="26" rx="6" fill="#0066FF"/>
      <text x="234" y="171" fill="#FFFFFF" font-size="10" font-weight="bold" font-family="sans-serif">Savatga qo‘shish</text>

      <!-- Card 3 -->
      <rect x="380" y="0" width="160" height="190" rx="10" fill="#0D2652"/>
      <rect x="390" y="10" width="140" height="90" rx="6" fill="#143670"/>
      <circle cx="460" cy="55" r="22" fill="#10B981" opacity="0.4"/>
      <text x="394" y="122" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="sans-serif">Power Bank 20000</text>
      <text x="394" y="142" fill="#00E5FF" font-size="13" font-weight="bold" font-family="sans-serif">290 000 so‘m</text>
      <rect x="394" y="154" width="132" height="26" rx="6" fill="#0066FF"/>
      <text x="424" y="171" fill="#FFFFFF" font-size="10" font-weight="bold" font-family="sans-serif">Savatga qo‘shish</text>

