<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06142E"/>
      <stop offset="100%" stop-color="#08204D"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ecomBg)"/>

  <!-- Storefront Browser Frame -->
  <g transform="translate(100, 50)">
    <rect x="0" y="0" width="600" height="400" rx="14" fill="#0A1E40" stroke="rgba(22, 139, 255, 0.25)" stroke-width="2"/>
    <rect x="0" y="0" width="600" height="42" rx="14" fill="#0E2B5C"/>
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>
    <rect x="140" y="10" width="320" height="22" rx="6" fill="#081A38"/>
    <text x="180" y="25" fill="#94A3B8" font-size="11" font-family="sans-serif">🔒 https://nexstore-shop.uz</text>

    <!-- Product Grid -->
    <g transform="translate(30, 60)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="160" height="190" rx="10" fill="#0D2652"/>
